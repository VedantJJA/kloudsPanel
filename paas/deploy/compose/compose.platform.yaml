# kloudsPanel Platform Compose
# Production deployment manifest for a single Linux host.
# Usage: docker compose -f compose.platform.yaml up -d

name: klouds-platform

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  platform-control:
    name: platform-control
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  traefik-acme:
    name: klouds-traefik-acme
  klouds-data:
    name: klouds-data
  sablier-data:
    name: klouds-sablier-data
  agent-socket:
    name: klouds-agent-socket

services:

  # -- Traefik edge proxy ------------------------------------------------------
  traefik:
    image: traefik:v3.7
    container_name: klouds-traefik
    restart: unless-stopped
    networks:
      - platform-control
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../traefik/static.yaml:/traefik/static.yaml:ro
      - ../traefik/dynamic:/traefik/dynamic:ro
      - traefik-acme:/acme
    command:
      - --configfile=/traefik/static.yaml
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    environment:
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL=${ACME_EMAIL}
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_STORAGE=/acme/acme.json
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_HTTPCHALLENGE=true
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_HTTPCHALLENGE_ENTRYPOINT=web
    labels:
      - "io.paas.managed=true"
      - "io.paas.component=traefik"
    logging: *default-logging
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  # -- Sablier scale-to-zero ---------------------------------------------------
  sablier:
    image: sablierapp/sablier:1.10
    container_name: klouds-sablier
    restart: unless-stopped
    networks:
      - platform-control
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../sablier/config.yaml:/config.yaml:ro
      - sablier-data:/data
    command: ["start", "--config=/config.yaml"]
    labels:
      - "io.paas.managed=true"
      - "io.paas.component=sablier"
    logging: *default-logging

  agent:
    image: ghcr.io/klouds/agent:latest
    build:
      context: ../..
      dockerfile: apps/agent/Dockerfile
    container_name: klouds-agent
    restart: unless-stopped
    networks:
      - platform-control
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - agent-socket:/run/klouds
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AGENT_SOCKET=/run/klouds/agent.sock
    labels:
      - "io.paas.managed=true"
      - "io.paas.component=agent"
    logging: *default-logging

  api:
    image: ghcr.io/klouds/api:latest
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: klouds-api
    restart: unless-stopped
    networks:
      - platform-control
    volumes:
      - klouds-data:/data
      - agent-socket:/run/klouds:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ../traefik/dynamic:/traefik/dynamic
    environment:
      - LISTEN_ADDR=:8080
      - DB_DRIVER=${DB_DRIVER:-sqlite}
      - DB_PATH=/data/klouds.db
      - DATABASE_URL=${DATABASE_URL:-}
      - MASTER_KEY_HEX=${MASTER_KEY_HEX}
      - AGENT_SOCKET=/run/klouds/agent.sock
      - ROOT_DOMAIN=${ROOT_DOMAIN}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITLAB_CLIENT_ID=${GITLAB_CLIENT_ID:-}
      - GITLAB_CLIENT_SECRET=${GITLAB_CLIENT_SECRET:-}
      - BITBUCKET_CLIENT_ID=${BITBUCKET_CLIENT_ID:-}
      - BITBUCKET_CLIENT_SECRET=${BITBUCKET_CLIENT_SECRET:-}
    labels:
      - "io.paas.managed=true"
      - "io.paas.component=api"
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${ROOT_DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
    depends_on:
      - agent
      - traefik
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: ghcr.io/klouds/web:latest
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    container_name: klouds-web
    restart: unless-stopped
    networks:
      - platform-control
    environment:
      - API_BASE=http://api:8080
      - PORT=3000
    labels:
      - "io.paas.managed=true"
      - "io.paas.component=web"
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`${ROOT_DOMAIN}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
    depends_on:
      - api
    logging: *default-logging
