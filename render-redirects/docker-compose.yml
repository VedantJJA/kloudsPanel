services:
  traefik:
    image: traefik:v3.1
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Sits in front of nginx and applies the redirect/rewrite rules before
  # any request reaches the static file server.
  redirector:
    build: .
    environment:
      RULES_CONFIG: /etc/redirector/rules.json
      STATIC_ROOT: /var/www/html
      UPSTREAM_URL: http://nginx:80
      LISTEN_ADDR: :8080
    volumes:
      - ./config.example.json:/etc/redirector/rules.json:ro
      - static-content:/var/www/html:ro
    depends_on:
      - nginx
    labels:
      - traefik.enable=true
      - traefik.http.routers.site.rule=Host(`example.com`)
      - traefik.http.routers.site.entrypoints=web
      - traefik.http.services.site.loadbalancer.server.port=8080

  # Serves the actual static files. Not exposed to Traefik directly —
  # only the redirector talks to it.
  nginx:
    image: nginx:alpine
    volumes:
      - static-content:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"

volumes:
  static-content:
